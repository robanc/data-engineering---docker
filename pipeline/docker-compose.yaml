services:
  pgdatabase:
    image: postgres:18
    environment:
      POSTGRES_USER: "root"
      POSTGRES_PASSWORD: "root"
      POSTGRES_DB: "ny_taxi"
    volumes:
      - "ny_taxi_postgres_data:/var/lib/postgresql/data"
    ports:
      - "5432:5432"

  taxi_ingest:
    image: taxi_ingest:v001
    depends_on:
      - pgdatabase
    command: >
      --pg_user=root
      --pg_pass=root
      --pg_host=pgdatabase
      --pg_port=5432
      --pg_db=ny_taxi
      --year=2021
      --month=1
      --chunksize=100000
      --target_table=yellow_taxi_trips_2021_1

  taxi_zones_ingest:
    image: taxi_ingest:v001
    depends_on:
      - pgdatabase
    command: >
      --pg_user=root
      --pg_pass=root
      --pg_host=pgdatabase
      --pg_port=5432
      --pg_db=ny_taxi
      --url=https://github.com/DataTalksClub/nyc-tlc-data/releases/download/misc/taxi_zone_lookup.csv
      --target_table=taxi_zones

  pgadmin:
    image: dpage/pgadmin4
    depends_on:
      - pgdatabase
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@admin.com"
      PGADMIN_DEFAULT_PASSWORD: "root"
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_PREFIX_COUNT: 1
    volumes:
      - "pgadmin_data:/var/lib/pgadmin"
    ports:
      - "8085:80"



volumes:
  ny_taxi_postgres_data:
  pgadmin_data:
