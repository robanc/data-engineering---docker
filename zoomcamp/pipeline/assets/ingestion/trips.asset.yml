name: ingestion.trips
type: python
image: python:3.11
connection: bigquery-defaultss

materialization:
  type: table
  strategy: append

# Point the asset to the python script
script: trips.asset.py

columns:
  - name: taxi_type
    type: string
    description: "Taxi type (yellow or green)"
  - name: extracted_at
    type: timestamp
    description: "Timestamp when data was extracted"